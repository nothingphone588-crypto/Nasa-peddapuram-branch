<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AMARAVASSAM | Space Settlement Command Center</title>
  <style>
    /* RESET & FUTURISTIC SPACE THEME */
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background: #070913; color: #e0e6ed; min-height: 100vh; display: flex; flex-direction: column; }
    
    .hidden { display: none !important; }

    /* LOGIN MODAL OVERLAY */
    .overlay {
      position: fixed; inset: 0; background: radial-gradient(circle at center, #13172e 0%, #030408 100%);
      display: flex; align-items: center; justify-content: center; z-index: 1000;
    }
    .login-card {
      background: rgba(18, 24, 43, 0.85); border: 1px solid #00d4ff; border-radius: 12px;
      padding: 35px; width: 340px; text-align: center; box-shadow: 0 0 25px rgba(0, 212, 255, 0.25);
      backdrop-filter: blur(10px);
    }
    .login-card h2 { color: #00d4ff; margin-bottom: 5px; font-size: 1.4rem; letter-spacing: 2px; }
    .login-card p { color: #7f8c8d; margin-bottom: 20px; font-size: 0.85rem; }
    .input-field {
      width: 100%; padding: 12px; margin-bottom: 15px; background: #0b0e1a; border: 1px solid #232d4b;
      color: #fff; border-radius: 6px; outline: none; transition: border 0.3s;
    }
    .input-field:focus { border-color: #00d4ff; }
    .btn-primary {
      width: 100%; padding: 12px; background: #00d4ff; border: none; color: #070913;
      font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s ease;
    }
    .btn-primary:hover { background: #009ac2; color: #fff; }
    .error-msg { color: #ff4757; font-size: 0.8rem; margin-top: 10px; min-height: 18px; }

    /* NAVBAR */
    .navbar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 15px 30px; background: #0e1222; border-bottom: 1px solid #1c2442;
    }
    .logo { font-size: 1.2rem; font-weight: bold; color: #00d4ff; letter-spacing: 1px; }
    .user-info { display: flex; align-items: center; gap: 12px; }
    .badge { padding: 3px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; text-transform: uppercase; }
    .badge-leader { background: #ff4757; color: #fff; }
    .badge-member { background: #2ed573; color: #000; }
    .btn-small { padding: 6px 12px; background: #232d4b; border: none; color: #fff; border-radius: 4px; cursor: pointer; }
    .btn-small:hover { background: #ff4757; }

    /* DASHBOARD CONTENT */
    .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; width: 100%; flex: 1; }
    
    /* NAV BUTTONS GRID */
    .nav-actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 30px; }
    .action-card {
      background: #0e1222; border: 1px solid #1c2442; padding: 20px; border-radius: 8px;
      text-align: center; cursor: pointer; transition: all 0.3s ease; text-decoration: none; color: inherit; display: block;
    }
    .action-card:hover { border-color: #00d4ff; transform: translateY(-3px); box-shadow: 0 4px 15px rgba(0,212,255,0.15); }
    .action-card h3 { font-size: 1rem; color: #00d4ff; margin-bottom: 5px; }
    .action-card p { font-size: 0.75rem; color: #a0a5c0; }

    /* MAIN CONTENT PANELS */
    .panel { background: #0e1222; border: 1px solid #1c2442; border-radius: 8px; padding: 25px; margin-bottom: 25px; }
    .panel h2 { color: #00d4ff; margin-bottom: 15px; font-size: 1.2rem; border-bottom: 1px solid #1c2442; padding-bottom: 8px; }

    /* PDF PROMPT CARD */
    .pdf-banner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(135deg, #0e1222 0%, #171e38 100%);
      border: 1px solid #00d4ff;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 25px;
    }
    .pdf-banner-text h3 { color: #00d4ff; font-size: 1.1rem; margin-bottom: 4px; }
    .pdf-banner-text p { color: #a0a5c0; font-size: 0.85rem; }
    .btn-pdf {
      padding: 10px 20px;
      background: #00d4ff;
      color: #070913;
      font-weight: bold;
      border-radius: 6px;
      text-decoration: none;
      white-space: nowrap;
      transition: 0.2s ease;
    }
    .btn-pdf:hover { background: #009ac2; color: #fff; }

    /* ADMIN & ADD PERSON STYLES */
    .admin-panel { border-color: #ff4757; background: rgba(255, 71, 87, 0.03); }
    .admin-panel h2 { color: #ff4757; border-bottom-color: rgba(255, 71, 87, 0.3); }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; margin-bottom: 15px; }
    
    /* SCHEDULE & ROSTER TABLES */
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid #1c2442; }
    th { color: #00d4ff; }

    /* PROGRESS BAR */
