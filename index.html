<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AMARAVASSAM | Space Settlement Command Center</title>
  <style>
    /* RESET & FUTURISTIC SPACE THEME */
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background: #070913; color: #e0e6ed; min-height: 100vh; display: flex; flex-direction: column; }
    
    .hidden { display: none !important; }

    /* LOGIN MODAL OVERLAY */
    .overlay {
      position: fixed; inset: 0; background: radial-gradient(circle at center, #13172e 0%, #030408 100%);
      display: flex; align-items: center; justify-content: center; z-index: 1000;
    }
    .login-card {
      background: rgba(18, 24, 43, 0.85); border: 1px solid #00d4ff; border-radius: 12px;
      padding: 35px; width: 340px; text-align: center; box-shadow: 0 0 25px rgba(0, 212, 255, 0.25);
      backdrop-filter: blur(10px);
    }
    .login-card h2 { color: #00d4ff; margin-bottom: 5px; font-size: 1.4rem; letter-spacing: 2px; }
    .login-card p { color: #7f8c8d; margin-bottom: 20px; font-size: 0.85rem; }
    .input-field {
      width: 100%; padding: 12px; margin-bottom: 15px; background: #0b0e1a; border: 1px solid #232d4b;
      color: #fff; border-radius: 6px; outline: none; transition: border 0.3s;
    }
    .input-field:focus { border-color: #00d4ff; }
    .btn-primary {
      width: 100%; padding: 12px; background: #00d4ff; border: none; color: #070913;
      font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s ease;
    }
    .btn-primary:hover { background: #009ac2; color: #fff; }
    .error-msg { color: #ff4757; font-size: 0.8rem; margin-top: 10px; min-height: 18px; }
    >
